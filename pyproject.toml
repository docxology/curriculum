[project]
name = "educational-materials-generator"
version = "0.1.0"
description = "AI-powered educational course materials generator using Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "markdown>=3.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "black>=26.10.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# NOTE: pytest configuration lives in pytest.ini (pytest.ini takes precedence
# over [tool.pytest.ini_options]; a duplicate table here would be ignored).

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

